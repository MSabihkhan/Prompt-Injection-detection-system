apiVersion: 1
datasources:
  - name: PromptGuard DB
    uid: promptguard-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: ${PG_HOST}:${PG_PORT}
    user: ${PG_USER}
    isDefault: true
    jsonData:
      database: ${PG_DB}
      sslmode: ${PG_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${PG_PASSWORD}
