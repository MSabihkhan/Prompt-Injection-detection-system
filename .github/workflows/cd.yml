# Deploy to Azure after CI passes on main: build the image (with the champion model baked in),
# push it to Azure Container Registry (ACR), and roll it out to Azure Container Apps.
#
# DISABLED (`if: false` on the job) until the Azure resources exist. To enable:
#   1. Create a resource group, an ACR, and a Container App (ingress on port 8000).
#   2. Set the app's runtime secrets on the Container App itself (or as Key Vault references),
#      never in this workflow: SUPABASE_URL, SUPABASE_KEY, PROMPTGUARD_API_KEY.
#   3. Create an Entra ID app registration with a federated credential for this repo's `main`
#      branch (OIDC, so no client secret is stored). Give it AcrPush on the ACR and
#      Contributor on the Container App.
#   4. Add these repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#      ACR_NAME, AZURE_RESOURCE_GROUP, AZURE_CONTAINERAPP_NAME
#      (MLFLOW_TRACKING_URI/USERNAME/PASSWORD already exist for CI).
#   5. Replace `if: false` below with `if: github.event.workflow_run.conclusion == 'success'`.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/promptguard-api:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  # deploy exactly the commit CI tested

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export champion model
        run: python app/inference.py export --model champion --out model/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

      - name: Smoke test /health
        run: |
          fqdn=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -sf "https://$fqdn/health" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 10
          done
          echo "Deployed app never reported healthy"; exit 1
