<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PromptGuard demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 6rem; font: inherit; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; }
    #result { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; }
    .benign { background: #e6f4ea; }
    .injection { background: #fce8e6; }
  </style>
</head>
<body>
  <h1>PromptGuard</h1>
  <p>Model: {{ model_name }}. Paste a prompt and check whether it looks like an injection attempt.</p>
  <textarea id="text" placeholder="Enter a prompt..."></textarea><br>
  <button id="submit">Classify</button>
  <div id="result"></div>

  <script>
    const resultBox = document.getElementById("result");

    document.getElementById("submit").addEventListener("click", async () => {
      const text = document.getElementById("text").value;
      if (!text.trim()) return;
      resultBox.style.display = "block";
      resultBox.className = "";
      resultBox.textContent = "Checking...";
      try {
        const res = await fetch("/classify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        if (!res.ok) { resultBox.textContent = data.detail || "Error"; return; }
        resultBox.className = data.is_injection ? "injection" : "benign";
        resultBox.innerHTML = `<strong>${data.is_injection ? "Injection" : "Benign"}</strong>
          (score ${data.score.toFixed(3)}, threshold ${data.threshold.toFixed(3)})`;
      } catch (e) {
        resultBox.textContent = "Request failed: " + e;
      }
    });
  </script>
</body>
</html>
