# Local API only. Export the model first (see Dockerfile). .env supplies SUPABASE_URL/SUPABASE_KEY
# (prediction logging; local JSONL fallback if unset) and PROMPTGUARD_API_KEY.
# Airflow, Grafana and Postgres run separately: ops/docker-compose.ops.yml (see docs/OPS_GUIDE.md).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROMPTGUARD_MODEL: /app/model
